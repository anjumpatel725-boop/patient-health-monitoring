<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - HealthCare</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="auth-page">

    <div class="auth-container">

        <!-- LEFT SIDE -->

        <div class="auth-info">

            <div class="brand">

                <div class="logo-circle">
                    ♥
                </div>

                <div>

                    <h2>
                        HealthCare
                    </h2>

                    <span>
                        Patient Health Monitoring System
                    </span>

                </div>

            </div>


            <div class="info-content">

                <h1>
                    Create Your Account
                </h1>

                <div class="features">

                    <div>
                        ♥ Real-time health monitoring
                    </div>

                    <div>
                        ♥ Vital signs tracking
                    </div>

                    <div>
                        ♥ Intelligent health alerts
                    </div>

                    <div>
                        ♥ Secure healthcare access
                    </div>

                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="auth-form-area">

            <div class="form-card">

                <h1>
                    Create Account
                </h1>

              
                <form id="registerForm">

                    <!-- FULL NAME -->

                    <div class="input-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter full name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="input-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            required
                        >

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            required
                        >

                    </div>

<!-- ROLE -->

<div class="input-group">

    <label for="role">
        Account Type
    </label>

    <select
        id="role"
        required
        disabled
    >

        <option value="patient" selected>
            Patient
        </option>

    </select>

</div>


                    <!-- ERROR -->

                    <p
                        id="registerError"
                        class="error-message"
                    ></p>


                    <!-- BUTTON -->

                    <button
                        type="submit"
                        class="main-button"
                    >
                        Register
                    </button>

                </form>


                <p class="switch-text">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
