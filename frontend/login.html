<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - HealthCare</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="auth-page">

    <div class="auth-container">

        <!-- LEFT SIDE -->

        <div class="auth-info">

            <div class="brand">

                <div class="logo-circle">
                    ♥
                </div>

                <div>

                    <h2>HealthCare</h2>

                    <span>
                        Patient Health Monitoring System
                    </span>

                </div>

            </div>


            <div class="info-content">

                <h1>
                    Welcome Back!
                </h1>

                <div class="features">

                    <div>
                        ♥ Real-time health monitoring
                    </div>

                    <div>
                        ♥ Vital signs tracking
                    </div>

                    <div>
                        ♥ Intelligent health alerts
                    </div>

                    <div>
                        ♥ Secure patient management
                    </div>

                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="auth-form-area">

            <div class="form-card">

                <h1>
                    Login
                </h1>

                <form id="loginForm">

                    <!-- EMAIL -->

                    <div class="input-group">

                        <label for="loginEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- ROLE -->

                    <div class="input-group">

                        <label for="loginRole">
                            Role
                        </label>

                        <select
                            id="loginRole"
                            required
                        >

                            <option value="">
                                Select Role
                            </option>

                            <option value="patient">
                                Patient
                            </option>

                            <option value="doctor">
                                Doctor
                            </option>

                            <option value="admin">
                                Admin
                            </option>

                        </select>

                    </div>


                    <!-- ERROR -->

                    <p
                        id="loginError"
                        class="error-message"
                    ></p>


                    <!-- BUTTON -->

                    <button
                        type="submit"
                        class="main-button"
                    >
                        Login
                    </button>

                </form>


                <p class="switch-text">

                    Don't have an account?

                    <a href="register.html">
                        Register
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
